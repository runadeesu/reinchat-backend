workflows:
  ios-capacitor-workflow:
    name: iOS REINChat IPA Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: latest
      xcode: latest
    scripts:
      - name: Install npm dependencies
        script: |
          npm install
      - name: Build Web Application
        script: |
          npm run build
      - name: Sync Capacitor iOS Project
        script: |
          npx cap sync ios
      - name: Build Unsigned Release iOS App for Sideloadly
        script: |
          export COPYFILE_DISABLE=1
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -sdk iphoneos -configuration Release -derivedDataPath build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

          rm -rf build/Payload build/REINChat.ipa
          mkdir -p build/Payload
          cp -R build/Build/Products/Release-iphoneos/App.app build/Payload/

          # Remove all macOS AppleDouble metadata and hidden resource fork files (._*)
          find build/Payload -name ".DS_Store" -delete || true
          find build/Payload -name "._*" -delete || true
          rm -rf build/Payload/__MACOSX || true

          # Force executable permissions (+x) on App binary and app bundle
          chmod -R 755 build/Payload/App.app
          chmod +x build/Payload/App.app/App || true

          # Create PkgInfo and dummy embedded.mobileprovision to satisfy Sideloadly line 822 scanner
          echo "APPL????" > build/Payload/App.app/PkgInfo
          touch build/Payload/App.app/embedded.mobileprovision

          # Ensure Info.plist variables are explicitly set and convert to clean XML1 format
          if [ -f build/Payload/App.app/Info.plist ]; then
            sed -i '' 's/\$(EXECUTABLE_NAME)/App/g' build/Payload/App.app/Info.plist || true
            sed -i '' 's/\$(PRODUCT_BUNDLE_IDENTIFIER)/com.studios.reinchat/g' build/Payload/App.app/Info.plist || true
            sed -i '' 's/\$(PRODUCT_NAME)/REINChat/g' build/Payload/App.app/Info.plist || true
            sed -i '' 's/\$(CAPACITOR_DEBUG)/true/g' build/Payload/App.app/Info.plist || true
            plutil -convert xml1 build/Payload/App.app/Info.plist || true
          fi

          cd build
          # Python Zipper creating explicit Payload and Payload/App.app directory entries for Sideloadly line 822
          python3 -c "import zipfile, os; ziph = zipfile.ZipFile('REINChat.ipa', 'w', zipfile.ZIP_DEFLATED); ziph.write('Payload', 'Payload'); ziph.write('Payload/App.app', 'Payload/App.app'); [ziph.write(os.path.join(root, f), os.path.relpath(os.path.join(root, f), '.')) for root, dirs, files in os.walk('Payload') for f in files]; ziph.close()"

          cp REINChat.ipa $CM_BUILD_DIR/REINChat.ipa
    artifacts:
      - "*.ipa"
      - ios/App/build/*.ipa
